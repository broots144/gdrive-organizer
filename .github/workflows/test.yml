name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[all]"
      - name: installed dependencies meet pyproject floors
        run: |
          python scripts/check_floors.py
          python -m pip check
      - name: fs backend end to end (real renamex_np / getxattr / iopolicy on macOS)
        run: python tests/test_fs_local.py
      - name: drive backend against a mocked Drive API
        run: python tests/test_drive_mock.py
      - name: rules to manifest generator
        run: python tests/test_rules_to_plan.py
      - name: peek parser limits (capped download, zip bomb, time limit)
        run: python tests/test_peek_limits.py
      - name: unit tests (empty-dirs, drive_api retry and OAuth, journal, backend drift, validate)
        run: python tests/test_units.py
      - name: sandbox settings cover everything run outside the sandbox
        run: python tests/test_sandbox_settings.py
      - name: state guard rules
        run: python tests/test_state_guard.py
      - name: demo end to end (fake tree, fs backend)
        run: DEMO_FAST=1 bash examples/demo/run.sh
      - name: CLI smoke
        run: gdrive-organizer --help

  state-guard:
    # repo-state pattern (docs/DECISIONS.md D-013): code changes carry a STATE.md update
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "code changes update STATE.md (chore: and deps: titles exempt)"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/state_guard.py "$BASE" "$HEAD" "$TITLE"
