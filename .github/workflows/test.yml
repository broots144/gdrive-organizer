name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[all]"
      - name: fs backend end to end (real renamex_np / getxattr / iopolicy on macOS)
        run: python tests/test_fs_local.py
      - name: drive backend against a mocked Drive API
        run: python tests/test_drive_mock.py
      - name: rules to manifest generator
        run: python tests/test_rules_to_plan.py
      - name: peek parser limits (capped download, zip bomb, time limit)
        run: python tests/test_peek_limits.py
      - name: demo end to end (fake tree, fs backend)
        run: DEMO_FAST=1 bash examples/demo/run.sh
      - name: CLI smoke
        run: gdrive-organizer --help
