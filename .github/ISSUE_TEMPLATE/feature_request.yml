name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with your Drive, and where does the tool get in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change, and how it stays safe and reversible
