version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # pyproject uses open ">=" floors on purpose (broad compatibility, Python 3.9+). Only move a
    # floor when a release falls outside the range; security updates still arrive separately.
    versioning-strategy: increase-if-necessary
