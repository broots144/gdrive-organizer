# Dependabot (ADR-089 in workshop144/sublevel): weekly; per ecosystem one PR for minor+patch and
# one for majors, across all its directories. A release must be 3 days old (majors 7 where
# supported). n0's dependabot-merge.py squash-merges a PR once every CI check is green on main's tip.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        update-types: [minor, patch]
      actions-majors:
        update-types: [major]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        update-types: [minor, patch]
      python-majors:
        update-types: [major]
